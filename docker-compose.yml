version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: healthcare-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-1d}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:5173,http://localhost:5174}
      - DEFAULT_ADMIN_EMAIL=${DEFAULT_ADMIN_EMAIL:-admin@healthcare.com}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD}
    restart: always
    networks:
      - healthcare-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: healthcare-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: always
    networks:
      - healthcare-net

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: healthcare-admin
    ports:
      - "5174:80"
    depends_on:
      - backend
    restart: always
    networks:
      - healthcare-net

networks:
  healthcare-net:
    driver: bridge
